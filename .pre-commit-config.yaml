repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-toml
          - id: check-yaml
          - id: end-of-file-fixer
            types: [python]
          - id: trailing-whitespace
          - id: requirements-txt-fixer
          - id: check-added-large-files
            args: ["--maxkb=5000"]
          - id: check-merge-conflict

    # Secret scanning: blocks a commit that stages a key, token or password.
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.0
      hooks:
          - id: gitleaks

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.6
      hooks:
          - id: ruff-check
            types_or: [python, pyi, jupyter, pyproject]
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            args:
                [
                    "--ignore-words-list=aci,acount,acounts,fallow,ges,hart,hist,nd,ned,ois,wqs,watermask,tre,mape,INE,ine,anual,limite,ser,calle,administrativo,mis,historial,oficial,gir",
                    "--skip=*.csv,*.geojson,*.json,*.yml*.js,*.html,*cff,*.pdf,*.ipynb",
                ]

    - repo: https://github.com/kynan/nbstripout
      rev: 0.9.2
      hooks:
          - id: nbstripout
            # maps/ notebooks are published with their outputs (map and tables)
            exclude: ^maps/

    # uv project: keep uv.lock in step with pyproject.toml.
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.13.10
      hooks:
          - id: uv-lock
